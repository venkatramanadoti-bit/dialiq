<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DialIQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <div class="flex-center" style="min-height: 100vh; padding: 2rem;">
        <div class="card" style="width: 100%; max-width: 420px;">
            <div class="text-center mb-4">
                <a href="/" class="navbar-brand" style="justify-content: center; margin-bottom: 1rem;">
                    <div class="logo">📞</div>
                    <span>DialIQ</span>
                </a>
                <h2>Welcome Back</h2>
                <p class="mt-2">Sign in to your DialIQ workspace</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                        </svg>
                        <input type="email" class="form-input" id="email" name="email" placeholder="you@company.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" class="form-input" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                </div>

                <div class="flex-between mb-3">
                    <label class="flex gap-1" style="cursor: pointer; font-size: 0.9rem; color: var(--text-muted);">
                        <input type="checkbox" name="remember" style="width: 16px; height: 16px; accent-color: var(--accent-gold);"> Remember me
                    </label>
                    <a href="/forgot-password" class="btn btn-ghost btn-sm">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary w-full btn-lg">Sign In</button>
            </form>

            <div class="text-center mt-4">
                <p style="color: var(--text-muted);">Don't have an account? <a href="/register">Create one</a></p>
            </div>

            <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-gold);">
                <p style="font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-bottom: 1rem;">Or continue with</p>
                <div class="flex-center gap-2">
                    <button class="btn btn-secondary" style="width: 48px; height: 48px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"></path></svg>
                    </button>
                    <button class="btn btn-secondary" style="width: 48px; height: 48px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1.46l12-.16-2.88 2.88-1.32-1.32 2.58-2.58H15V9l4.09 4.09-4.09 4.09z"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('button[type="submit"]');
            const originalHtml = btn.innerHTML;

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner spinner-sm"></span> Signing in...';

            try {
                const formData = new FormData(form);
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams(formData)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Login failed');
                }

                localStorage.setItem('dialiq_token', data.access_token);
                localStorage.setItem('dialiq_user', JSON.stringify(data.user));

                DialIQ.showToast('Welcome back!', 'success');
                setTimeout(() => window.location.href = '/dashboard', 1000);
            } catch (error) {
                DialIQ.showToast(error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        });
    </script>
</body>
</html>
