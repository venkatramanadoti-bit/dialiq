</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><a href="/dashboard" class="sidebar-brand"><div class="logo" style="width: 36px; height: 36px;">📞</div><span>DialIQ</span></a></div>
        <nav>
            <ul class="sidebar-nav">
                <li class="sidebar-nav-item"><a href="/dashboard" class="sidebar-nav-link"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg><span class="sidebar-nav-label">Dashboard</span></a></li>
                <li class="sidebar-nav-item"><a href="/agents" class="sidebar-nav-link"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span class="sidebar-nav-label">AI Agents</span></a></li>
                <li class="sidebar-nav-item"><a href="/campaigns" class="sidebar-nav-link active"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 13.67A5 5 0 0 0 18 9a5 5 0 0 0-8.87-2.17 3 3 0 0 0 0 5.66A5 5 0 0 1 18 15a5 5 0 0 1 3 7.34"></path><path d="M22 12h-4"></path></svg><span class="sidebar-nav-label">Campaigns</span></a></li>
                <li class="sidebar-nav-item"><a href="/leads" class="sidebar-nav-link"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg><span class="sidebar-nav-label">Leads & CRM</span></a></li>
                <li class="sidebar-nav-item"><a href="/calls" class="sidebar-nav-link"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg><span class="sidebar-nav-label">Call Logs</span></a></li>
                <li class="sidebar-nav-item"><a href="/analytics" class="sidebar-nav-link"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg><span class="sidebar-nav-label">Analytics</span></a></li>
                <li class="sidebar-nav-item"><a href="/wallet" class="sidebar-nav-link"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg><span class="sidebar-nav-label">Wallet & Billing</span></a></li>
                <li class="sidebar-nav-item"><a href="/simulator" class="sidebar-nav-link"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg><span class="sidebar-nav-label">Call Simulator</span></a></li>
                <li class="sidebar-nav-item" style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-gold);"><a href="/settings" class="sidebar-nav-link"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg><span class="sidebar-nav-label">Settings</span></a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="dashboard-header flex-between">
            <div class="dashboard-title"><h1>Campaigns</h1><p>Create and manage bulk calling campaigns</p></div>
            <button class="btn btn-primary" onclick="openModal('campaignModal')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> Create Campaign</button>
        </header>

        <div class="tabs" id="campaignTabs">
            <button class="tab-btn active" data-status="all">All</button>
            <button class="tab-btn" data-status="draft">Draft</button>
            <button class="tab-btn" data-status="running">Running</button>
            <button class="tab-btn" data-status="completed">Completed</button>
        </div>

        <div class="grid grid-auto" id="campaignsGrid"></div>
    </main>

    <!-- Campaign Modal -->
    <div class="modal-overlay" id="campaignModal">
        <div class="modal" style="max-width: 700px;">
            <div class="modal-header"><h3 class="modal-title" id="campaignModalTitle">Create Campaign</h3><button class="modal-close" onclick="closeModal('campaignModal')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></div>
            <form id="campaignForm" class="modal-body">
                <input type="hidden" name="id" id="campaignId">
                <div class="form-group"><label class="form-label">Campaign Name *</label><input type="text" class="form-input" name="name" placeholder="e.g., Q1 Real Estate Outreach" required></div>
                <div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" name="description" placeholder="Campaign description"></textarea></div>
                <div class="grid grid-2"><div class="form-group"><label class="form-label">AI Agent *</label><select class="form-select" name="agent_id" id="campaignAgent" required></select></div><div class="form-group"><label class="form-label">Timezone</label><select class="form-select" name="timezone"><option value="Asia/Kolkata">Asia/Kolkata (IST)</option><option value="UTC">UTC</option><option value="America/New_York">America/New_York (EST)</option></select></div></div>
                <div class="grid grid-2"><div class="form-group"><label class="form-label">Start Time</label><input type="datetime-local" class="form-input" name="start_time"></div><div class="form-group"><label class="form-label">End Time</label><input type="datetime-local" class="form-input" name="end_time"></div></div>
                <div class="grid grid-3"><div class="form-group"><label class="form-label">Concurrent Calls</label><input type="number" class="form-input" name="concurrent_calls" value="5" min="1" max="50"></div><div class="form-group"><label class="form-label">Retry Attempts</label><input type="number" class="form-input" name="retry_attempts" value="3" min="0" max="10"></div><div class="form-group"><label class="form-label">Retry Interval (seconds)</label><input type="number" class="form-input" name="retry_interval" value="300" min="60" max="3600"></div></div>
                <div class="form-group"><label class="form-label">Retry On</label><div class="flex gap-3"><label class="flex gap-2" style="cursor: pointer;"><input type="checkbox" name="retry_on" value="busy" checked> Busy</label><label class="flex gap-2" style="cursor: pointer;"><input type="checkbox" name="retry_on" value="no_answer" checked> No Answer</label><label class="flex gap-2" style="cursor: pointer;"><input type="checkbox" name="retry_on" value="failed"> Failed</label></div></div>
            </form>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="closeModal('campaignModal')">Cancel</button><button type="submit" form="campaignForm" class="btn btn-primary">Save Campaign</button></div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/campaigns.js"></script>
</body>
</html>
